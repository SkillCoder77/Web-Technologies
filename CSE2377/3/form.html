<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration Form</title>
  </head>
  <body>
    <main>
      <h1>Student Registration Form</h1>
      <form action="#" method="get">
        <p><label for="roll">Roll number</label> <input id="roll" name="roll" placeholder="1234-12-123-123"></p>
        <p><label for="student-name">Student name</label> <input id="student-name" name="studentName" autocomplete="name"></p>
        <p><label for="password">Password</label> <input id="password" type="password" autocomplete="new-password"></p>
        <p><label for="confirm-password">Confirm password</label> <input id="confirm-password" type="password" autocomplete="new-password"></p>
        <p>
          <label for="semester">Semester</label>
          <select id="semester" name="semester">
            <option value="1">Semester 1</option><option value="2">Semester 2</option>
            <option value="3">Semester 3</option><option value="4">Semester 4</option>
            <option value="5">Semester 5</option><option value="6">Semester 6</option>
            <option value="7">Semester 7</option><option value="8">Semester 8</option>
          </select>
        </p>
        <p>
          <label for="subject">Subject suggestion</label>
          <input id="subject" name="subject" list="subjects">
          <datalist id="subjects">
            <option value="C++"><option value="Data Structures"><option value="DBMS">
            <option value="Networks"><option value="DAA"><option value="Physics"><option value="Maths">
          </datalist>
        </p>
        <fieldset>
          <legend>Choose subjects</legend>
          <select id="selected-subjects" name="selectedSubjects" size="4" multiple>
            <option value="cs101">C++</option><option value="cs102">Data Structures</option>
            <option value="cs103">DBMS</option><option value="cs104">Networks</option>
            <option value="cs105">DAA</option><option value="cs106">Physics</option><option value="cs107">Maths</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Section</legend>
          <label><input type="radio" name="section" value="A"> A</label>
          <label><input type="radio" name="section" value="B"> B</label>
        </fieldset>
        <fieldset>
          <legend>Electives</legend>
          <label><input type="checkbox" name="electives" value="cs401"> Java</label>
          <label><input type="checkbox" name="electives" value="cs402"> Python</label>
          <label><input type="checkbox" name="electives" value="cs403"> Safety</label>
        </fieldset>
        <p><label for="address">Address</label><br><textarea id="address" name="address"></textarea></p>
        <p><label for="rating">Course rating</label> <input id="rating" name="rating" type="range" min="1" max="5" value="4"></p>
        <p><label for="score">Score</label> <input id="score" name="score" type="number" min="0" max="100" value="3"></p>
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
      </form>
    </main>
  </body>
</html>
