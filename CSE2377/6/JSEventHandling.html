<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript Event Handling</title>
    <script src="JSEventHandling.js" defer></script>
  </head>
  <body>
    <main>
      <h1>JavaScript Event Handling</h1>
      <form id="address-form">
        <p><label for="student-name">Name</label> <input id="student-name" name="name" required></p>
        <p><label for="phone">Phone number</label> <input id="phone" name="phone" type="tel"></p>
        <p><label for="contact-address">Contact address</label><br><textarea id="contact-address" name="contactAddress"></textarea></p>
        <p><label for="permanent-address">Permanent address</label><br><textarea id="permanent-address" name="permanentAddress"></textarea></p>
        <button id="copy-address" type="button">Copy contact address</button>
        <button id="read-instructions" type="button">Read instructions</button>
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
        <button id="extra-button" type="button">Extra button</button>
        <p id="event-message" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
