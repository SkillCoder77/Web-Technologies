<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM Manipulation</title>
    <script src="DOMManipulation.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Student Registration</h1>
      <form id="registration-form" novalidate>
        <p>
          <label id="roll-label" for="roll">Roll number</label>
          <input id="roll" name="roll" aria-describedby="roll-help">
          <small id="roll-help">Format: 1234-12-123-123</small>
        </p>
        <p><label for="student-name">Student name</label> <input id="student-name" name="name"></p>
        <p><label for="password">Password</label> <input id="password" name="password" type="password"></p>
        <p><label for="confirm-password">Confirm password</label> <input id="confirm-password" name="confirmPassword" type="password"></p>
        <fieldset>
          <legend>Section</legend>
          <label><input type="radio" name="section" value="A"> A</label>
          <label><input type="radio" name="section" value="B"> B</label>
        </fieldset>
        <fieldset>
          <legend>Electives</legend>
          <label><input type="checkbox" name="electives" value="cs401"> Java</label>
          <label><input type="checkbox" name="electives" value="cs402"> Python</label>
          <label><input type="checkbox" name="electives" value="cs403"> Safety</label>
        </fieldset>
        <p><label for="address">Address</label><br><textarea id="address" name="address"></textarea></p>
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
