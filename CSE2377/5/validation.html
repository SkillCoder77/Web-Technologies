<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration</title>
    <script src="validation.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Student Registration</h1>
      <form id="registration-form">
        <p>
          <label for="roll">Roll number</label>
          <input id="roll" name="roll" required pattern="[0-9]{4}-[0-9]{2}-[0-9]{3}-[0-9]{3}" placeholder="1234-12-123-123">
        </p>
        <p>
          <label for="student-name">Student name</label>
          <input id="student-name" name="name" required pattern="[A-Za-z][A-Za-z '-]*" title="Use letters, spaces, apostrophes, or hyphens." autocomplete="name">
        </p>
        <p>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="new-password">
        </p>
        <p>
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" required autocomplete="new-password">
        </p>
        <p>
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" required pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel">
        </p>
        <p>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </p>
        <p>
          <label for="address">Address</label>
          <textarea id="address" name="address"></textarea>
        </p>
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
